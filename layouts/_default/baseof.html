<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ SEO-friendly dynamic title -->
  <title>
    {{- if .IsHome -}}
    {{ .Site.Title }} | UK Property Investment, Management & Holiday Escapes
    {{- else -}}
    {{ .Title }} | {{ .Site.Title }}
    {{- end -}}
  </title>

  <!-- ✅ Meta description (NEVER empty) -->
  <meta name="description"
    content="{{ with .Params.description }}{{ . }}{{ else }}Adventure Northern Escapes is a UK-based property investment and management company creating quality homes, holiday lets, and long-term value.{{ end }}">

  {{ if .Params.noindex }}
  <meta name="robots" content="noindex, nofollow">
  {{ else }}
  <meta name="robots" content="index, follow">
  {{ end }}

<link rel="icon" href="{{ "images/favicon.png" | relURL }}">

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>

  <!-- DNS Prefetch for additional domains -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Critical CSS (render-blocking, but essential) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Non-Critical CSS (Deferred) - Fonts and Icons -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"></noscript>

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet"></noscript>

  <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=agrandir@500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://api.fontshare.com/v2/css?f[]=agrandir@500&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>

  {{ if not .Params.hide_site_chrome }}
  <script src="/js/theme.js" defer></script>
  {{ end }}
</head>

<body>
  {{ if not .Params.hide_site_chrome }}
  {{ partial "site/header.html" . }}
  {{ end }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ if not .Params.hide_site_chrome }}
  {{ partial "site/footer.html" . }}
  {{ end }}

  <!-- Defer Bootstrap JS for faster page load -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>

</html>
