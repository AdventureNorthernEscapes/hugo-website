<header>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark-blue">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand d-flex flex-column flex-shrink-1 align-items-center align-items-lg-start text-center text-lg-start" href="/">
  <picture>
    <!-- Mobile version -->
    <source srcset="/images/200_200_icon.svg" media="(max-width: 768px)">
    <!-- Desktop version -->
    <img src="/images/400_400_icon (1).svg" alt="Adventure Northern Logo" class="navbar-logo">
  </picture>
  <div class="navbar-logo-text mt-1">
    <p class="logo-title mb-0">Adventure Northern</p>
    <p class="logo-subtitle mb-0">ESCAPES</p>
  </div>
</a>
      <!-- Toggler -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <i class="fa-solid fa-bars" id="menu-icon"></i>
      </button>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          {{ range .Site.Menus.main }}
          <li class="nav-item">
            <a class="nav-link" href="{{ .URL }}">{{ .Name }}</a>
          </li>
          {{ end }}
        </ul>

        <!-- Contact Button (visible on all devices now) -->
        <div class="d-flex align-items-center ms-lg-4 mt-3 mt-lg-0">
          <button id="theme-toggle" class="btn btn-outline-light me-3">
            <i class="fa-solid fa-circle-half-stroke"></i>
          </button>
          <a href="/contact" class="btn btn-custom-primary">Contact Us</a>
        </div>
      </div>
    </div>
  </nav>
</header>


<script>
  document.addEventListener("DOMContentLoaded", function() {
    const toggler = document.querySelector('.navbar-toggler');
    const icon = document.getElementById('menu-icon');
    const navbar = document.getElementById('navbarNav');

    // Toggle menu icon between bars and close (X)
    toggler.addEventListener('click', () => {
      setTimeout(() => {
        const isOpen = navbar.classList.contains('show');
        icon.className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
      }, 200);
    });

    // Close navbar when clicking outside
    document.addEventListener('click', (e) => {
      if (!navbar.contains(e.target) && !toggler.contains(e.target)) {
        const bsCollapse = new bootstrap.Collapse(navbar, { toggle: false });
        bsCollapse.hide();
        icon.className = 'fa-solid fa-bars';
      }
    });
  });
</script>
