{{ define "main" }}
<section
  class="thank-you-section d-flex align-items-center justify-content-center text-center"
  style="min-height: 80vh; padding-top: 120px; background-color: #f8f9fa;"
>
  <div class="container">
    <div class="thank-you-card mx-auto" style="max-width: 650px;">
      
      <!-- Success Icon -->
      <div
        class="icon-wrapper mx-auto mb-4 d-flex align-items-center justify-content-center"
        style="width: 100px; height: 100px; border-radius: 50%; background-color: #c3a76d;"
      >
        <i class="fa fa-check text-white" style="font-size: 48px;"></i>
      </div>

      <!-- Title and Message -->
      <h1 class="display-5 fw-bold mb-3" style="color: #1a2433;">
        {{ .Params.hero.title }}
      </h1>
      <p class="lead mb-4" style="color: #333;">
        {{ .Params.hero.message }}
      </p>

      <!-- Button -->
      <a
        href="{{ .Site.BaseURL }}"
        class="btn btn-lg fw-semibold"
        style="background-color: #c3a76d; color: #fff; border-radius: 6px;"
      >
        {{ .Params.hero.button_text }}
      </a>
    </div>
  </div>
</section>
{{ end }}
